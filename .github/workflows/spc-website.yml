name: SPC website
on:
  pull_request:
  push:
    branches: [main, codex/orio-spc-3-website]
permissions:
  contents: read
jobs:
  static-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - run: node scripts/build-spc.mjs
      - run: node --test scripts/test-spc.mjs
      - run: python3 -m unittest discover -s scripts -p test_deploy_spc.py
      - name: Verify tracked output is reproducible
        run: git diff --exit-code -- public/spc-3
